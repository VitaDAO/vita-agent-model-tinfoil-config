name: Build slim SGLang image
on:
  workflow_dispatch:
  push:
    paths: ["docker/**", ".github/workflows/image-build.yml"]
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.slim
          platforms: linux/amd64
          push: true
          tags: ghcr.io/vitadao/vita-agent-model-sglang:slim-0.5.16-nvcc
          provenance: false

      - name: Print digest and size
        run: |
          docker buildx imagetools inspect ghcr.io/vitadao/vita-agent-model-sglang:slim-0.5.16-nvcc | head -20
