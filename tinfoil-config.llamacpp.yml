# Tinfoil Container Configuration — vita-agent-model
#
# Serves TeichAI/Qwen3.8-27B-Fable-Distill-GGUF (BF16, 54.7 GB across two
# shards) on the control.inf6 H200 via llama.cpp. Replaces the retired
# Fable-Fusion-711 deployment; the SGLang/FP8 variant of that model lives on
# in tinfoil-config.sglang.yml and was never successfully deployed.
#
# Runtime choice: the wrapped artifact is GGUF, which SGLang cannot load and
# vLLM does not cover for this hybrid Gated-DeltaNet arch. llama.cpp only.
# Same attention topology as Fable-Fusion-711 (64 layers, 16 full-attention,
# 4 KV heads x 256 head_dim, 256k native), so the KV math carries over:
# a full 262144 slot costs ~17 GB. 54.7 GB weights + ~17 GB KV + the BF16
# MTP head fit comfortably in the H200's 141 GB.
#
# CONCURRENCY LIMIT: llama.cpp's MTP implementation (ggml-org/llama.cpp#22673)
# only supports a single server slot, hence -np 1. This endpoint serves one
# request at a time. Dropping --spec-type/--spec-draft-n-max allows raising
# -np, at the cost of the MTP speedup. This model ships a nextn head kept at
# BF16 in every quant (blk.64, 424.7M params), so draft-mtp works here too.

cvm-version: 0.7.5
cpus: 8
# The model package must fit in enclave RAM: the dm-verity artifact at
# /tinfoil/mpk is memory-backed, so `memory` has to exceed the mpk size, not
# merely the runtime's working set. This package is 252.2 GiB; the 262144
# (256 GiB) tier would clear it by only ~3.8 GiB, and undersized memory fails
# in <90s with an empty error_message. 524288 is the proven-safe tier on this
# host (the 465 GB Fable-Fusion wrap ran on it).
memory: 524288
gpus: 1

models:
  - name: "qwen3-8-27b-fable-distill-gguf"
    repo: "TeichAI/Qwen3.8-27B-Fable-Distill-GGUF@accb5eb6e2077d85c30dffb6263af9d8ace08b77"
    mpk: "e64929ed6279cf0af50f26ef6c599ec772d03a64546227ddd42151bc729a55fc_270792437760_c023f3da-b0ff-55f8-9cfc-92eb6886301c"

containers:
  - name: llamacpp
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:b2497f8834f5ecb4e38530f6bf2734b8e0be107ff48e4720145911c86930f2ce
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    command:
      # The wrap contains every quant (252 GiB); select BF16 explicitly.
      # Pointing at shard 1 of 2 is enough — llama.cpp loads the rest.
      - -m
      - /tinfoil/mpk/mpk-e64929ed6279cf0af50f26ef6c599ec772d03a64546227ddd42151bc729a55fc/BF16/Qwen3.8-27B-Fable-Distill-BF16-00001-of-00002.gguf
      - -a
      - fable-distill
      - -ngl
      - all
      - -c
      - '262144'
      - -np
      - '1'
      # MTP speculative decoding off the model's embedded nextn tensors.
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - '3'
      # Puts thinking in message.reasoning_content, matching SGLang's
      # --reasoning-parser qwen3, so callers survive a runtime swap unchanged.
      - --reasoning-format
      - deepseek
      # Qwen3.5-family template with thinking; accepts enable_thinking and
      # reasoning_effort (low/medium/xhigh, template default xhigh).
      - --jinja
      # Text-only endpoint; keeps llama-server off the mmproj-*.gguf files
      # that sit alongside the weights in the same wrap. The model is
      # image-text-to-text — drop this and pass --mmproj to enable vision.
      - --no-mmproj
      - -fa
      # Quoted: bare `on` is a YAML 1.1 boolean, which would emit a non-string arg.
      - 'on'
      # Exposes draft-acceptance counters. Author's rule: below ~50% acceptance,
      # the non-MTP path is faster, so this is the knob worth watching.
      - --metrics
      - --host
      - 127.0.0.1
      - --port
      - '8080'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      # First boot verifies the 252 GiB package through dm-verity; the 465 GB
      # Fable-Fusion wrap took ~16 min, so expect roughly half that.
      start_period: 60m

# Fronts llama.cpp's OpenAI-compatible API over attested HTTPS.
shim:
  upstream-port: 8080
  paths:
    - /health
    - /metrics
    - /v1/models
    - /v1/chat/completions
    - /v1/completions
