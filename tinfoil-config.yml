# Tinfoil Container Configuration — vita-agent-model (SGLang / FP8 / DSpark)
#
# Serves the FP8 quant of TeichAI/Qwen3.8-27B-Fable-Distill with the DSpark
# speculative drafter RadixArk/Qwen3.8-27B-DSpark (2.72 GB BF16, trained with
# SpecForge against Qwen/Qwen3.8-27B-FP8; published acceptance 3.39 mean over
# 1,164 requests). Replaces native NEXTN MTP, which measured acceptance 2.2 and
# 141.7 tok/s here. This deployment is per-step-overhead bound (141.7 tok/s =
# only 41% of the H200's HBM bandwidth), so acceptance converts nearly linearly
# into tok/s: 2.2 -> 3.4 would be ~+50%.
#
# CAVEAT: the drafter was trained against STOCK Qwen3.8-27B, and the Fable
# distill moved the residual stream at its aux capture layers [4,16,28,40,52].
# Judge on meta_info.spec_accept_length (per-request, NOT the /metrics gauge,
# which resets every 40 decode iterations): >=3.0 keep, 2.5-3.0 marginal,
# <2.5 revert to tinfoil-config.nextn.yml (= tag v0.6.1).
#
# SGLang v0.5.17 is MANDATORY here: v0.5.16's DSpark verify path has no
# Gated-DeltaNet state commit, which silently corrupts state on this
# 48-GDN-layer target — wrong tokens, no crash, healthy-looking acceptance.

cvm-version: 0.7.5
cpus: 8
# Enclave RAM must hold both dm-verity model artifacts (28.8 + 2.5 GiB) AND the
# extracted container image (~35 GB): enclaves are diskless and containerd runs
# on a RAM-disk. 65536 is measured to fail during image extract.
memory: 131072
gpus: 1

models:
  - name: "qwen3-8-27b-fable-distill-fp8"
    repo: "alexdobrin/Qwen3.8-27B-Fable-Distill-FP8@dad2544d418ffb797af211fb49e4dd770af8e33f"
    mpk: "d3a7bc98aa8b8a1c7f4025da665a642167d806d9716d1d687ec4407cf99ebd98_30897172480_cb4975d7-de9d-52dd-b59e-09d7a85ff666"
  - name: "qwen3-8-27b-dspark-draft"
    repo: "RadixArk/Qwen3.8-27B-DSpark@85ef153be924f17ce4bf62726954eeaa4a73e854"
    mpk: "f5375ac19e7f423790758d947ddbb159ccddfbf533b210d681632aeee5d2a7e8_2718617600_650a897b-06de-5e1e-ab36-7c76a8942c89"

containers:
  - name: sglang
    image: lmsysorg/sglang:v0.5.17-cu129@sha256:bbe1ec8694ab6b0e6ea0a567c2d492ed7c9bed13cb33ffe356ade0aaa8343c9f
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    env:
      - HF_HUB_OFFLINE: '1'
      - TRANSFORMERS_OFFLINE: '1'
      - PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # SGLANG_ENABLE_SPEC_V2 removed: it no longer exists in v0.5.17 (spec
      # always runs the V2 worker) and would only emit a warning we cannot read.
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /tinfoil/mpk/mpk-d3a7bc98aa8b8a1c7f4025da665a642167d806d9716d1d687ec4407cf99ebd98
      - --served-model-name
      - fable-distill
      - --quantization
      - fp8
      # The drafter's config.json has auto_map -> dspark.DSparkDraftModel.
      # Executing that file is acceptable here: it lives inside the attested
      # dm-verity artifact, under the same integrity guarantee as the weights.
      - --trust-remote-code
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      # --- DSpark speculative decoding (replaces NEXTN 3/1/4) ---
      - --speculative-algorithm
      - DSPARK
      - --speculative-draft-model-path
      - /tinfoil/mpk/mpk-f5375ac19e7f423790758d947ddbb159ccddfbf533b210d681632aeee5d2a7e8
      # 7 = the checkpoint's own trained draft width (verify width 8 including
      # the target bonus token). num-draft-tokens is auto-derived; passing it,
      # or --speculative-num-steps / --speculative-eagle-topk, is either
      # force-overridden with a warning or a hard ValueError.
      - --speculative-dspark-block-size
      - '7'
      # REQUIRED: otherwise the draft inherits the target's block-FP8 recipe,
      # corrupting a checkpoint that is BF16 by design.
      - --speculative-draft-model-quantization
      - unquant
      # Real flag name. --mamba-scheduler-strategy is a deprecated alias
      # registered WITHOUT choices=, so a typo would pass argparse and die
      # ~20 min later inside a validator this enclave cannot show us.
      - --mamba-radix-cache-strategy
      - extra_buffer
      # --mamba-ssm-dtype and --mamba-full-memory-ratio deliberately UNSET:
      #  - ssm-dtype: this checkpoint asks for float32; forcing bfloat16
      #    (carried over from the old Fable-Fusion config) halves GDN
      #    recurrent-state precision across all 48 linear-attention layers to
      #    save ~5.7 GiB we do not need.
      #  - full-memory-ratio: under DSpark the cache solver's divisor grows
      #    ~2.6x, so 0.2 would collapse the mamba cache and cap concurrency ~7.
      - --attention-backend
      - fa3
      - --page-size
      - '64'
      - --mem-fraction-static
      - '0.85'
      - --context-length
      - '262144'
      - --chunked-prefill-size
      - '4096'
      # DSpark's fp32 GDN verify scratch is sized
      # max_running_requests x num_draft_tokens x 144 MiB, so the library
      # default of 48 would demand ~55 GiB. This endpoint serves ~1 stream.
      - --max-running-requests
      - '4'
      - --cuda-graph-max-bs-decode
      - '4'
      - --watchdog-timeout
      - '600'
      - --soft-watchdog-timeout
      - '300'
      - --enable-metrics
      - --log-level
      - warning
      - --host
      - 127.0.0.1
      - --port
      - '8080'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 60m

# /get_server_info is the only way to read the PARSED server args from outside a
# log-blind enclave — it is how we confirm DSpark actually engaged.
shim:
  upstream-port: 8080
  paths:
    - /health
    - /metrics
    - /v1/models
    - /v1/chat/completions
    - /v1/completions
    - /get_server_info
    - /get_model_info
