# Tinfoil Container Configuration — vita-agent-model (SGLang / FP8)
#
# Replaces the llama.cpp + GGUF deployment, which measured 97.7 tok/s — only
# ~1.19 TB/s of weight traffic against the H200's ~4.8 TB/s, i.e. ~25% of the
# card. At 25% utilisation the limiter is per-token overhead, not bandwidth,
# so a smaller quant would not have helped; the runtime had to change.
#
# FP8 over BF16 deliberately: BF16 is 55.6 GB, nearly double the 30.2 GB of
# bytes-per-token we already serve, giving it a *lower* ceiling than the GGUF
# it would replace. This FP8 build is 36.8 GB and runs on the H200's native
# FP8 tensor cores.
#
# Quantisation is block-wise e4m3 (weight_block_size [128,128], dynamic
# activations). The Gated-DeltaNet linear_attn conv1d/in_proj tensors are in
# modules_to_not_convert, so the sensitive state-space path stays high
# precision. All 15 mtp.* tensors survive the conversion, which is what keeps
# NEXTN speculative decoding available.

cvm-version: 0.7.5
cpus: 8
# Host RAM, not VRAM — weights and KV live on the GPU. SGLang streams the 11
# FP8 shards (~3.3 GB each) to the device rather than staging all 36.8 GB in
# RAM, so peak host use is the largest shard plus the torch/CUDA context.
# 32 GB. Verify against `tinfoil container metrics` once it has served traffic.
memory: 32768
gpus: 1

models:
  - name: "qwen3-6-27b-fable-fusion-711-fp8"
    repo: "xzanomad/Qwen3.6-27B-Fable-Fusion-711-FP8@ff8f3b38c46ffbbb1c0b2b34bb02e2783b41c65a"
    mpk: "84718781d85366d862837feb4f049f295ce2a0cea0dcb003a92f841d713c6c34_36795064320_1617f750-244a-5b62-8638-dd5fd162da21"

containers:
  - name: sglang
    image: lmsysorg/sglang:v0.5.14-cu129@sha256:885da20811baa77e1c680cad0511d50efbaf94ebe43def9182bdf5290f47dbc5
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    env:
      - HF_HUB_OFFLINE: '1'
      - TRANSFORMERS_OFFLINE: '1'
      - PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      - SGLANG_ENABLE_SPEC_V2: '1'
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /tinfoil/mpk/mpk-84718781d85366d862837feb4f049f295ce2a0cea0dcb003a92f841d713c6c34
      # Unchanged from the llama.cpp deployment so callers need no edits.
      - --served-model-name
      - fable-711
      - --quantization
      - fp8
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      # MTP off the model's own 15 mtp.* tensors. eagle-topk MUST stay 1.
      # Author's constraint: temperature <= 1.0 and repetition_penalty 1.0,
      # or draft acceptance collapses. llama.cpp measured 49.6% acceptance
      # (71.3/46.8/30.3% by position) — compare against that here.
      - --speculative-algorithm
      - NEXTN
      - --speculative-num-steps
      - '3'
      - --speculative-eagle-topk
      - '1'
      - --speculative-num-draft-tokens
      - '4'
      # Hybrid Gated-DeltaNet state cache; this arch is on SGLang's
      # extra_buffer allowlist (srt/arg_groups/overrides.py).
      - --mamba-scheduler-strategy
      - extra_buffer
      - --mamba-full-memory-ratio
      - '0.2'
      - --mamba-ssm-dtype
      - bfloat16
      # SGLang's tuned attention-backend override is is_sm100_supported()-gated
      # (Blackwell). The H200 is sm90, so it never fires — pin fa3 explicitly.
      - --attention-backend
      - fa3
      - --page-size
      - '64'
      - --mem-fraction-static
      - '0.85'
      - --context-length
      - '262144'
      - --chunked-prefill-size
      - '4096'
      # The other half of the fix: llama.cpp's MTP is capped at one slot.
      - --max-running-requests
      - '16'
      - --cuda-graph-max-bs
      - '16'
      - --watchdog-timeout
      - '600'
      - --soft-watchdog-timeout
      - '300'
      - --enable-metrics
      - --log-level
      - warning
      - --host
      - 127.0.0.1
      - --port
      - '8080'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      # 36.8 GB to verify vs 465 GB for the GGUF wrap, so boot should beat
      # the ~16 min the llama.cpp deployment took.
      start_period: 60m

shim:
  upstream-port: 8080
  paths:
    - /health
    - /metrics
    - /v1/models
    - /v1/chat/completions
    - /v1/completions
