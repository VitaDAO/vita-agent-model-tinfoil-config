# Tinfoil Container Configuration — vita-agent-model (SGLang / BF16)
#
# SGLang deployment of TeichAI/Qwen3.8-27B-Fable-Distill (BF16 safetensors,
# ~55 GB). Replaces the llama.cpp + GGUF v0.3.0 deployment, which measured
# 72.7 tok/s — ~1.9 TB/s of weight traffic against the H200's ~4.8 TB/s
# (~39% of the card), limited by llama.cpp per-token overhead and its
# single-slot MTP. SGLang runs NEXTN speculative decoding with real
# concurrency and proper kernels for this hybrid Gated-DeltaNet arch.
#
# BF16 deliberately: no FP8 checkpoint of this distill exists yet, and an
# on-the-fly quant would not protect the sensitive linear_attn conv1d/in_proj
# tensors the way the old Fusion FP8's modules_to_not_convert did. If a
# careful block-wise FP8 appears, it halves bytes-per-token again.
#

cvm-version: 0.7.5
cpus: 8
# The model package must fit in enclave RAM: the dm-verity artifact at
# /tinfoil/mpk is memory-backed, so `memory` has to exceed the mpk size, not
# merely the runtime's working set. This package is ~52 GiB; the 65536 tier
# would leave ~12 GiB for the SGLang runtime (torch + CUDA host allocations +
# compile caches), less than the ~27 GiB headroom the proven v0.2.2 sizing
# gave it. Undersized memory fails in <90s with an empty error_message.
memory: 131072
gpus: 1

models:
  - name: "qwen3-8-27b-fable-distill"
    repo: "TeichAI/Qwen3.8-27B-Fable-Distill@ac2b133895580be05ee90a6a7cdcc23cdf998bd0"
    mpk: "03de8ccf58a13db876e540dfb4b5979908b64a8d0bc1b792fa9d920f8dc65350_55593234432_8c9f69f6-52b1-5c88-beec-37a254dd918a"

containers:
  - name: sglang
    image: lmsysorg/sglang:v0.5.16-cu129@sha256:b688781f3ef66522365ec570885a064b6734750ee22f0d32b3ed49aad87fbf90
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    env:
      - HF_HUB_OFFLINE: '1'
      - TRANSFORMERS_OFFLINE: '1'
      - PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      - SGLANG_ENABLE_SPEC_V2: '1'
      - SGLANG_ENABLE_OVERLAP_PLAN_STREAM: '1'
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /tinfoil/mpk/mpk-03de8ccf58a13db876e540dfb4b5979908b64a8d0bc1b792fa9d920f8dc65350
      # Same id the llama.cpp deployment served, so callers need no edits.
      - --served-model-name
      - fable-distill
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      # MTP off the model's own BF16 nextn head (blk.64, 424.7M params).
      # eagle-topk MUST stay 1. Temperature <= 1.0 and repetition_penalty 1.0
      # or draft acceptance collapses. llama.cpp measured 37.7% acceptance at
      # the temp-1.0 thinking sampler and 68.5% at defaults — compare here.
      - --speculative-algorithm
      - NEXTN
      - --speculative-num-steps
      - '3'
      - --speculative-eagle-topk
      - '1'
      - --speculative-num-draft-tokens
      - '4'
      # Hybrid Gated-DeltaNet state cache; this arch is on SGLang's
      # extra_buffer allowlist (srt/arg_groups/overrides.py).
      - --mamba-scheduler-strategy
      - extra_buffer
      - --mamba-full-memory-ratio
      - '0.2'
      - --mamba-ssm-dtype
      - bfloat16
      # SGLang's tuned attention-backend override is is_sm100_supported()-gated
      # (Blackwell). The H200 is sm90, so it never fires — pin fa3 explicitly.
      - --attention-backend
      - fa3
      - --page-size
      - '64'
      - --mem-fraction-static
      - '0.85'
      - --context-length
      - '262144'
      - --chunked-prefill-size
      - '4096'
      # The other half of the fix: llama.cpp's MTP is capped at one slot.
      - --max-running-requests
      - '16'
      - --cuda-graph-max-bs
      - '16'
      - --watchdog-timeout
      - '600'
      - --soft-watchdog-timeout
      - '300'
      - --enable-metrics
      - --log-level
      - warning
      - --host
      - 127.0.0.1
      - --port
      - '8080'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      # ~52 GiB to dm-verity-verify plus SGLang weight load + CUDA graph
      # capture; the 252 GiB GGUF wrap took ~31 min, this should be well under.
      start_period: 60m

# Fronts SGLang's OpenAI-compatible API over attested HTTPS.
shim:
  upstream-port: 8080
  paths:
    - /health
    - /metrics
    - /v1/models
    - /v1/chat/completions
    - /v1/completions
